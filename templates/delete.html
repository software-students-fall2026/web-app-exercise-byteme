{% extends "base.html" %}

{% block title %}
  Delete post | Campus Lost &amp; Found
{% endblock %}

{% block content %}
  <h1>Delete post</h1>

  <section class="detail">
    <p>
      Are you sure you want to delete “{{ item.title }}”?
    </p>

    <p>This will permanently remove the post.</p>

    <form
      method="post"
      action="{{ url_for('delete_item', item_id=item['_id']) }}"
      class="field"
    >
      <button type="submit" class="button button-danger">
        Delete
      </button>
    </form>

    <a
      class="button"
      href="{{ url_for('item_detail', item_id=item['_id']) }}"
    >
      Cancel
    </a>
  </section>
{% endblock %}
