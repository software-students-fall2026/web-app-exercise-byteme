{% extends "base.html" %}

{% block title %}
  Add post | Campus Lost &amp; Found
{% endblock %}

{% block content %}
  <h1> {{ 'Edit post' if item else 'Add post' }} </h1>
  <section class="detail">

    {% if error %}
      <p class="error">{{ error }}</p>
    {% endif %}

    <form
      method="POST"
      action="{{ url_for('edit_item', item_id=item['_id']) if item else url_for('add_item') }}">

      <div class="field">
        <label for="type">Type</label>
        <select name="type" id="type" required>
            <option value=""> ----choose----</option>
                {% for t in ITEM_TYPES %}
                    <option value="{{ t }}" {% if form.get('type') == t %}selected{% endif %}>{{ t }}</option>
                {% endfor %}
        </select>
      </div>


      <div class="field">
        <label for="title">Title</label>
        <input type="text" id="title" name="title" required 
        value="{{ form.get('title') }}" />
      </div>
      
      <div class="field">
        <label for="description">Description</label>
        <textarea id="description" name="description" rows="5">{{ form.get('description') or '' }}</textarea>
      </div>

      <div class="field">
        <label for="category">Category</label>
         <select name="category" id="category">
            <option value=""> ----choose----</option>
                {% for c in CATEGORIES %}
                    <option value="{{ c }}" {% if form.get('category') == c %}selected{% endif %}>{{ c }}</option>
                {% endfor %}
        </select>
      </div>

      <div class="field">
        <label for="building">Building</label>
         <select name="building" id="building" required>
            <option value=""> ----choose----</option>
                {% for b in BUILDINGS %}
                    <option value="{{ b }}" {% if form.get('building') == b %}selected{% endif %}>{{ b }}</option>
                {% endfor %}
        </select>
      </div>

      <div class="field">
        <label for="location">Location</label>
        <input type="text" id="location" name="location"
        value="{{ form.get('location') }}" />
      </div>

      <div class="field">
        <label for="date">Date</label>
        <input type="date" id="date" name="date" 
        value="{{ form.get('date') }}" required />
      </div>

      <div class="field">
        <label for="contact">Contact</label>
        <input type="text" id="contact" name="contact" 
        value="{{ form.get('contact') }}" required />
      </div>

    {% if item %}
        <div class="field">
            <label for="status">Status</label>
            <select name="status" id="status" required>
                <option value=""> ----choose----</option>
                    {% for s in STATUSES %}
                        <option value="{{ s }}" {% if form.get('status') == s %}selected{% endif %}>{{ s }}</option>
                    {% endfor %}
            </select>
        </div>

    {% endif %}


      <button type="submit" class="button">{{ 'Save' if item else 'Add' }}</button>

    <a
      class="button"
      href="{{ url_for('home') }}"
    >
      Cancel
    </a>
    </form>
  </section>
{% endblock %}
